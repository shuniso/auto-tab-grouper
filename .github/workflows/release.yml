name: Release

# v* タグの push で、テスト → zip 作成 → GitHub Release への添付を行う
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Release の作成に必要
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Test
        run: npm test

      # タグ（v を除く）と manifest.json のバージョンが一致しなければ失敗させる
      - name: Package
        id: package
        # 代入を分けないと、package.sh の失敗が echo の成功で隠れてステップが通ってしまう
        run: |
          zip=$(scripts/package.sh "${GITHUB_REF_NAME#v}")
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_PATH: ${{ steps.package.outputs.zip }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ZIP_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
